services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: smarthome
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: smarthome
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarthome"]
      interval: 5s
      retries: 20
  mongo:
    image: mongo:8
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 20
  setup:
    build: .
    env_file: .env
    environment: &appenv
      DATABASE_URL: postgres://smarthome:local-development-only@postgres:5432/smarthome
      MONGO_URL: mongodb://mongo:27017
    command: ["sh", "-c", "node backend/migrate.js && node backend/seed.js"]
    depends_on:
      postgres: {condition: service_healthy}
      mongo: {condition: service_healthy}
  app:
    build: .
    env_file: .env
    environment: *appenv
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      setup: {condition: service_completed_successfully}
  worker:
    build: .
    env_file: .env
    environment: *appenv
    command: ["node", "backend/worker.js"]
    depends_on:
      setup: {condition: service_completed_successfully}
volumes:
  postgres_data:
  mongo_data:
